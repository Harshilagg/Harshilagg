<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 150" width="844" height="150" role="img" aria-label="Pac-Man eating buzzwords">
<style>
  .panel  { fill: #0d1117; }
  .noise  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 20px; fill: #6e7681; text-anchor: middle; letter-spacing: 0;
             animation-duration: 14.0s; animation-timing-function: steps(1,end);
             animation-iteration-count: infinite; }
  .truth  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 20px; fill: #e8edf3; text-anchor: middle;
             animation: reveal 14.0s linear infinite; opacity: 0; }
  .rider  { animation: drive 14.0s linear infinite; }
  .ghost1 { animation: chase 14.0s linear infinite; }
  .ghost2 { animation: chase2 14.0s linear infinite; }
  .jaw    { fill: #ffd93d; }
@keyframes drive{0%,4.286%{transform:translateX(-40.0px)}64.286%,100%{transform:translateX(884.0px)}}
@keyframes chase{0%,4.286%{transform:translateX(-158.0px)}64.286%,100%{transform:translateX(766.0px)}}
@keyframes chase2{0%,4.286%{transform:translateX(-236.0px)}64.286%,100%{transform:translateX(688.0px)}}
@keyframes reveal{0%,68.571%{opacity:0}74.286%,91.429%{opacity:1}97.143%,100%{opacity:0}}
